<table mat-table [dataSource]="rows()">
  <ng-container matColumnDef="provider">
    <th mat-header-cell *matHeaderCellDef>Provider</th>
    <td mat-cell *matCellDef="let c"><app-provider-chip [provider]="c.provider" /></td>
  </ng-container>

  <ng-container matColumnDef="path">
    <th mat-header-cell *matHeaderCellDef>Remote path</th>
    <td mat-cell *matCellDef="let c" class="path">{{ c.remotePath }}</td>
  </ng-container>

  <ng-container matColumnDef="size">
    <th mat-header-cell *matHeaderCellDef class="num">Size</th>
    <td mat-cell *matCellDef="let c" class="num">{{ bytes(c.size) }}</td>
  </ng-container>

  <ng-container matColumnDef="verified">
    <th mat-header-cell *matHeaderCellDef>Verified</th>
    <td mat-cell *matCellDef="let c" [matTooltip]="c.verifiedBy">{{ when(c.verifiedAt) }}</td>
  </ng-container>

  <ng-container matColumnDef="hash">
    <th mat-header-cell *matHeaderCellDef>Hash</th>
    <td mat-cell *matCellDef="let c" class="hash" [matTooltip]="c.hash">{{ c.hash.slice(0, 12) }}</td>
  </ng-container>

  <ng-container matColumnDef="item">
    <th mat-header-cell *matHeaderCellDef>Copy</th>
    <td mat-cell *matCellDef="let c" class="item">
      <app-provider-chip [provider]="c.provider" />
      <div class="wrap">{{ c.remotePath }}</div>
      <div class="meta">{{ bytes(c.size) }} · verified {{ when(c.verifiedAt) }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
      @if (c.provider !== 'gphotos') {
        <button mat-icon-button matTooltip="Restore to the server" (click)="restore.emit(c)">
          <mat-icon>cloud_download</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns(); sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: columns()"></tr>
</table>
