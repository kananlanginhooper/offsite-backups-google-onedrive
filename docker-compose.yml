# The API + UI. No database service: it uses the existing databases named in .env.
# Joins the shared external network "homelab" that every home-project container uses
# (created once per host with the subnet from the shared dev standard).
services:
  offsite:
    build: .
    env_file: .env
    ports:
      # one IPv4 address only: a bare "port:port" also binds [::]
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8101}:${PORT:-8101}"
    volumes:
      # writable only so "Sign in" can save a new token. The push jobs share this rclone.conf: the app
      # writes only the two configured remotes, after checking the account, and keeps the file's owner
      - ${RCLONE_CONFIG_DIR}:/config/rclone
      - ${RESTORE_HOST_DIR}:/restores
    restart: unless-stopped

networks:
  default:
    name: homelab
    external: true
